name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Windows checks (${{ matrix.environment }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        environment: [base, gui]
    env:
      CHECK_ENVIRONMENT: ${{ matrix.environment }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out assessed revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Microsoft WebP Image Extension
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $before = @(Get-AppxPackage -Name Microsoft.WebpImageExtension -ErrorAction Stop)
          Write-Output "WebP packages before: $($before.Count)"
          $before | Select-Object Name, Version, Architecture, Publisher, InstallLocation | Format-List
          $wingetCommand = Get-Command winget -ErrorAction SilentlyContinue
          if ($null -eq $wingetCommand) {
            Write-Output 'Bootstrapping WinGet using Microsoft.WinGet.Client and Repair-WinGetPackageManager.'
            Install-PackageProvider -Name NuGet -Force -ErrorAction Stop | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -ErrorAction Stop | Out-Null
            Import-Module Microsoft.WinGet.Client -ErrorAction Stop
            Repair-WinGetPackageManager -AllUsers -ErrorAction Stop
            $wingetCommand = Get-Command winget -ErrorAction SilentlyContinue
          }
          if ($null -ne $wingetCommand) {
            $winget = $wingetCommand.Source
          } else {
            $appInstaller = Get-AppxPackage -Name Microsoft.DesktopAppInstaller -ErrorAction Stop | Sort-Object Version -Descending | Select-Object -First 1
            if ($null -eq $appInstaller) { throw 'WinGet bootstrap produced no registered App Installer for this runner user.' }
            $winget = Join-Path $appInstaller.InstallLocation 'winget.exe'
            if (-not (Test-Path -LiteralPath $winget -PathType Leaf)) { throw 'Registered App Installer contains no usable WinGet executable.' }
          }
          Write-Output "WinGet executable: $winget"
          & $winget --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $winget install --id 9PG2DK419DRG --exact --source msstore --accept-source-agreements --accept-package-agreements --disable-interactivity --silent
          $codecInstallExit = $LASTEXITCODE
          Write-Output "WebP installation exit: $codecInstallExit"
          $after = @(Get-AppxPackage -Name Microsoft.WebpImageExtension -ErrorAction Stop)
          Write-Output "WebP packages after: $($after.Count)"
          $after | Select-Object Name, Version, Architecture, Publisher, InstallLocation | Format-List
          if ($codecInstallExit -ne 0) { exit $codecInstallExit }
          if ($after.Count -eq 0) { throw 'Store installation reported success but WebP extension is not registered for this runner user.' }

      - name: Set up CPython 3.14 (64-bit)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: x64

      - name: Install ${{ matrix.environment }} environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          if ($env:CHECK_ENVIRONMENT -eq 'gui') {
            & $python -m pip install -r requirements.txt -r requirements-gui.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip install --no-build-isolation -e '.[dev,gui]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            & $python -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip install --no-build-isolation -e '.[dev]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Deliberate GUI dependency inconsistency control
        if: matrix.environment == 'gui'
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          & $python -c "import pathlib, sys, sysconfig; assert pathlib.Path(sys.prefix).resolve() == pathlib.Path('.venv').resolve(), 'Control must target this project venv'; metadata = pathlib.Path(sysconfig.get_path('purelib')) / 'ci_dependency_control-0.0.0.dist-info'; metadata.mkdir(); (metadata / 'METADATA').write_text('Metadata-Version: 2.1\nName: ci-dependency-control\nVersion: 0.0.0\nRequires-Dist: Pillow==999999.0.0\n', encoding='utf-8'); print('Deliberate dependency control metadata:', metadata)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Identify ${{ matrix.environment }} environment and confirm Qt availability
        run: |
          Write-Output "Event: $env:GITHUB_EVENT_NAME; workflow revision: $env:GITHUB_SHA"
          Write-Output "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH; image: $env:ImageOS / $env:ImageVersion; variant: $env:CHECK_ENVIRONMENT"
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          & $python -c "import platform, sys; print('Interpreter:', sys.executable); print('Python:', sys.version); print('Platform:', platform.platform(), platform.machine())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CHECK_ENVIRONMENT -eq 'gui') {
            & $python -c "import PySide6; from PySide6 import QtCore, QtWidgets; print('PySide6:', PySide6.__version__); print('Qt:', QtCore.qVersion()); print('QtWidgets:', QtWidgets.__file__)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            & $python -c "import importlib.util, sys; qt = importlib.util.find_spec('PySide6'); print('PySide6:', qt); sys.exit(0 if qt is None else 1)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run full ${{ matrix.environment }} checks
        run: |
          $checkout = $env:GITHUB_WORKSPACE
          $python = Join-Path $checkout '.venv\Scripts\python.exe'
          $runner = Join-Path $checkout 'tools\check.py'
          $runnerArguments = @('run', '--checkout', $checkout, '--python', $python, '--environment', $env:CHECK_ENVIRONMENT)
          if ($env:CHECK_ENVIRONMENT -eq 'gui') { $runnerArguments += '--require-gui' }
          Write-Output 'The maintained runner supplies offscreen Qt and probes a usable QApplication before testing.'
          & $python $runner @runnerArguments
          $checkExit = $LASTEXITCODE
          $receipts = @(Get-ChildItem -Path 'tmp/checks/*/receipt.json' -ErrorAction SilentlyContinue)
          foreach ($receiptFile in $receipts) {
            $receipt = Get-Content -LiteralPath $receiptFile.FullName -Raw | ConvertFrom-Json
            Write-Output "Runner aggregate: $($receipt.aggregate); exit: $checkExit; receipt: $($receiptFile.FullName)"
            foreach ($check in $receipt.checks) {
              Write-Output "Check: $($check.id); status: $($check.status); exit: $($check.exit_code)"
              Write-Output "Command argv: $($check.argv | ConvertTo-Json -Compress)"
              if ($null -ne $check.counts) {
                $counts = $check.counts
                Write-Output "Pytest: collected=$($counts.collected); passed=$($counts.passed); failed=$($counts.failed); skipped=$($counts.skipped); errors=$($counts.errors); GUI executed=$($counts.gui_executed)"
              }
            }
          }
          exit $checkExit

      - name: Report runner evidence availability
        if: always()
        run: |
          $receipts = @(Get-ChildItem -Path 'tmp/checks/*/receipt.json' -ErrorAction SilentlyContinue)
          if ($receipts.Count -eq 0) {
            $message = 'No runner receipt was produced. Inspect the native provisioning, setup/installation and check-step logs; this does not establish passing checks.'
          } else {
            $message = "Runner evidence is retained in the Windows $env:CHECK_ENVIRONMENT checks artifact, including original logs and pytest counts."
            $receipts | ForEach-Object { Write-Output "RECEIPT: $($_.FullName)" }
          }
          Write-Output $message
          $message >> $env:GITHUB_STEP_SUMMARY

      - name: Retain original runner receipts and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-checks-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/checks/*/*.json
            tmp/checks/*/*.bin
            tmp/checks/*/*.log
          include-hidden-files: true
          if-no-files-found: warn
