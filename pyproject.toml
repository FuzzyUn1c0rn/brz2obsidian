[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "brz2obsidian"
version = "0.3.0"
description = "Verified source-to-Obsidian migration"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13,<3", "markdown-it-py>=4.2,<4.3", "PyYAML>=6.0.3,<7", "Pillow>=12.3,<13", "simplejpeg>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "coverage>=7.16,<8"]
gui = ["PySide6==6.12.0"]

[project.scripts]
brz2obsidian = "brz2obsidian.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest"
cache_dir = "tmp/pytest-cache"
markers = ["gui: optional Qt adapter checks (skip cleanly without PySide6)"]

[tool.ruff]
target-version = "py314"
extend-exclude = [".scratch", "docs/history"]
cache-dir = "tmp/ruff-cache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brz2obsidian_ui = ["assets/*.svg"]
