[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "brz2obsidian"
version = "0.1.0"
description = "Verified source-to-Obsidian migration"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13,<3", "markdown-it-py>=4.2,<4.3"]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "PyYAML>=6.0.3,<7"]

[project.scripts]
brz2obsidian = "brz2obsidian.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = [".scratch"]

[tool.setuptools.packages.find]
where = ["src"]
