<!doctype html>
<!-- THROWAWAY comparison host. Three independently authored prototypes; no production runtime or converter integration. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brz2obsidian — compare UI prototypes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;font-family:"Segoe UI",system-ui,sans-serif;color:#243039;height:100vh;display:flex;flex-direction:column;padding:0 0 145px}iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#e9edf0}button,select{font:inherit}button{border:1px solid #53626b;border-radius:7px;background:#34434d;color:#fff;padding:6px 13px;min-height:34px;cursor:pointer}button:hover{background:#485b67}button:focus-visible,select:focus-visible{outline:3px solid #75b9ff;outline-offset:3px}.toolbar{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);background:#202b34;border:1px solid #45555f;color:#fff;border-radius:13px;box-shadow:0 8px 28px #0003;display:flex;align-items:center;justify-content:center;gap:17px;padding:12px 15px;max-width:calc(100% - 24px);width:max-content;flex-wrap:wrap}.toolbar label,.caption{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#bbcbd3;display:block;margin:0 0 4px}.row{display:flex;align-items:center;gap:9px}.variant{min-width:185px;text-align:center;font-size:14px;font-weight:600}.toolbar select{font-size:12px;padding:6px 9px;min-height:34px;background:#f4f7f8;color:#22313c;border:1px solid #bfcbd2;border-radius:6px;max-width:230px}.status{font-size:11px;color:#c0d0d8;max-width:220px;line-height:1.5}.divider{height:39px;width:1px;background:#4d5d68}.question{padding:10px 16px;text-align:center;font-size:12px;color:#566875;background:#f2f5f7;border-bottom:1px solid #d7e0e5;flex:none}.question strong{color:#354a56}#load-note{font-size:14px;text-align:center;padding:18px}.warning{color:#8c452c}.link{color:#bde1ff}.footer-note{font-size:10px;color:#bbccd6;text-align:center;width:100%;margin-top:-4px}@media(max-width:760px){body{padding-bottom:205px}.toolbar{bottom:10px;gap:9px;width:calc(100% - 24px)}.toolbar label,.caption,.divider{display:none}.toolbar .status{width:100%;max-width:none;text-align:center}.toolbar select{max-width:190px}.variant{min-width:170px}.question{font-size:11px}}
</style></head><body>
<div class="question"><strong>Which layout makes the conversion simplest?</strong> Compare three independent prototypes. All paths, pickers, and converter outcomes are synthetic.</div>
<div id="load-note" hidden></div><iframe id="preview" title="Interactive UI prototype" allow="clipboard-write"></iframe>
<aside class="toolbar" aria-label="Prototype comparison controls"><div><span class="caption">Independent layouts</span><div class="row"><button id="prev" aria-label="Previous prototype">←</button><span id="variant-label" class="variant"></span><button id="next" aria-label="Next prototype">→</button></div></div><div class="divider"></div><div><label for="scenario">Example state</label><select id="scenario"></select></div><div><label for="mode">Operation</label><select id="mode"><option value="convert">Convert archive</option><option value="inspect">Inspect archive</option><option value="check">Check vault</option></select></div><button id="restart">Restart</button><div id="state" class="status" aria-live="polite"></div><div class="footer-note">Prototype controls only · use ← / → to compare · no production stack chosen</div></aside>
<script>
'use strict';
const names={A:'Guided steps',B:'Workbench',C:'Compact task sheet'};
const examples={start:'Start / choose archive','review-clean':'Inspection · clean','review-warnings':'Inspection · warnings',destination:'Choose destination',running:'Conversion · running',success:'Vault created · clean','success-warnings':'Vault created · warnings',refused:'Inspection · refused',failed:'Conversion · failed',leftover:'Failure · leftover folder',changed:'Archive changed','published-error':'Vault created · follow-up error',unknown:'Publication status unknown','checker-clean':'Vault check · clean','checker-issues':'Vault check · issues','checker-failed':'Vault check · failed'};
const query=new URLSearchParams(location.search);let variant=names[query.get('variant')]?query.get('variant'):'A';let scenario=examples[query.get('scenario')]?query.get('scenario'):'start';let mode=['convert','inspect','check'].includes(query.get('mode'))?query.get('mode'):'convert';
const frame=document.getElementById('preview'),scenarioSelect=document.getElementById('scenario'),modeSelect=document.getElementById('mode');
scenarioSelect.innerHTML=Object.entries(examples).map(([value,label])=>`<option value="${value}">${label}</option>`).join('');
function url(){try{history.replaceState(null,'','?'+new URLSearchParams({variant,mode,scenario}))}catch{}}
function controls(){document.getElementById('variant-label').textContent=variant+' · '+names[variant];scenarioSelect.value=scenario;modeSelect.value=mode;document.getElementById('state').textContent='Synthetic example · '+examples[scenario];url()}
function show(){if(scenario.startsWith('checker-'))mode='check';controls();frame.src='variants/'+variant.toLowerCase()+'.html?'+new URLSearchParams({scenario,mode});document.getElementById('load-note').hidden=true;window.scrollTo({top:0,behavior:'instant'})}
function cycle(delta){const variants=Object.keys(names);variant=variants[(variants.indexOf(variant)+delta+3)%3];show()}
function key(event){if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('input,textarea,select,[contenteditable]')||event.target.ownerDocument.querySelector('dialog[open]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('restart').onclick=()=>{scenario='start';show()};scenarioSelect.onchange=()=>{scenario=scenarioSelect.value;if(!scenario.startsWith('checker-')&&mode==='check')mode='convert';show()};modeSelect.onchange=()=>{mode=modeSelect.value;scenario='start';show()};document.addEventListener('keydown',key);
frame.onload=()=>{try{const doc=frame.contentDocument;if(!doc?.body)return;doc.addEventListener('keydown',key)}catch{document.getElementById('state').textContent='Synthetic prototype loaded.'}};
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.type!=='prototype-state')return;const data=event.data;if(data.variant&&data.variant!==variant)return;if(examples[data.scenario])scenario=data.scenario;if(['convert','inspect','check'].includes(data.mode))mode=data.mode;controls();document.getElementById('state').textContent='Synthetic · '+mode+' · '+(data.status||data.scenario||scenario)});
show();
</script></body></html>
