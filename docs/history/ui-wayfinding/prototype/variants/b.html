n:0 0 6px}.help{font-size:12px;color:var(--muted);margin:6px 0 10px}.filebox{border:1px solid var(--line);background:white;border-radius:6px;padding:12px;margin:12px 0}.filetitle{font-weight:650;margin-bottom:5px}.path{font-family:Consolas,monospace;font-size:12px;overflow-wrap:anywhere;color:#46576c}.inputs button.wide{width:100%}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:600;margin:0 0 5px}.field input{width:100%;border:1px solid #b8c3d0;border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink)}.inputrow{display:flex;gap:6px}.inputrow input{min-width:0}.inputrow button{padding:7px 9px}.error{font-size:12px;color:#a92b24;margin-top:5px}.preview{border-left:3px solid #b7c9e2;padding:9px 11px;margin:15px 0 0;background:#edf2f8}.preview strong{font-size:11px;color:#5f6f82;display:block;margin-bottom:4px}.destnote{font-size:12px;color:#57705e;margin:8px 0}.tag{display:inline-flex;gap:5px;align-items:center;font-size:11px;border:1px solid #cfd9e6;background:#fff;color:#536477;border-radius:4px;padding:3px 7px;margin-top:8px}.inputs-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-size:11px;color:#7a8796}.results{padding:27px 32px 24px;min-width:0;display:flex;flex-direction:column}.result-heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.result-heading h1{font-size:23px;line-height:1.3;font-weight:650;letter-spacing:-.35px;margin:0 0 5px}.badge{font-size:11px;padding:4px 8px;white-space:nowrap;border:1px solid #cbd8e9;background:#f2f6fc;color:#47678e;border-radius:20px}.summary{border:1px solid #d3dfef;background:#f1f6fd;padding:19px 20px;border-radius:7px;display:flex;gap:13px}.symbol{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#dce8f8;color:#255fb5;font-weight:700}.summary h2{font-size:18px;line-height:1.35;margin:0 0 5px;font-weight:650}.summary p{margin:0;color:#506379;font-size:13px}.summary.success{background:#f0f7f2;border-color:#c6decf}.success .symbol{background:#d4e9da;color:#26733e}.summary.warn{background:#fff8e9;border-color:#e8d3a4}.warn .symbol{background:#f6e6bc;color:#886011}.summary.bad{background:#fff2f1;border-color:#e7c7c3}.bad .symbol{background:#f4d9d6;color:#a53c31}.facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);padding:20px 0;margin-bottom:20px;gap:18px}.fact strong{font-size:24px;display:block;font-weight:600;line-height:1.2}.fact span{font-size:12px;color:var(--muted)}.sectiontitle{font-size:13px;margin:20px 0 10px;font-weight:650}.finding{border-top:1px solid #e1e6ee;padding:12px 0;display:flex;align-items:flex-start;gap:10px}.finding:first-of-type{border-top:0}.finding .dot{color:#a57116;font-size:18px;line-height:1.15}.finding strong{font-size:13px;font-weight:600}.finding p{font-size:12px;color:var(--muted);margin:3px 0 0}.notice{margin:17px 0;border-left:3px solid #c9d5e5;padding:3px 0 3px 12px;color:#627184;font-size:12px}.destinationline{margin:15px 0;padding:13px 15px;background:#f8fafc;border:1px solid var(--line);border-radius:5px}.destinationline small{display:block;color:#627184;margin-bottom:4px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}.details{margin-top:24px;border-top:1px solid var(--line);padding-top:15px}.details summary{cursor:pointer;font-size:12px;font-weight:600;color:#50647e}.details pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;font:12px/1.6 Consolas,monospace;padding:15px;border:1px solid #e0e6ed;border-radius:5px;color:#46576c;max-height:230px;overflow:auto}.report-actions{display:flex;gap:8px;margin-top:12px}.report-actions button{font-size:12px;padding:6px 10px}.empty{display:grid;place-items:center;min-height:280px;text-align:center;padding:30px;color:#778496}.empty-icon{font-size:39px;font-weight:300;color:#a3b2c5;margin-bottom:10px}.empty h2{font-size:17px;color:#4b5e77;margin:0 0 6px;font-weight:600}.empty p{max-width:380px;font-size:13px;margin:0}.bottomhint{font-size:11px;color:#8290a0;border-top:1px solid var(--line);padding-top:15px;margin-top:auto}.toast{background:#263f5e;color:#fff;border-radius:5px;padding:11px 15px;margin-top:18px;font-size:12px;overflow-wrap:anywhere}.spinner{width:21px;height:21px;border:2px solid #b7cee9;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}.elapsed{font:12px Consolas,monospace;color:#536a88;margin-top:12px}.busyline{display:flex;align-items:center;gap:10px;margin:20px 0}.busyline span{font-size:13px;color:#536a88}@keyframes spin{to{transform:rotate(360deg)}}dialog{border:1px solid #bcc8d7;border-radius:9px;max-width:490px;width:calc(100% - 32px);padding:25px;color:var(--ink);box-shadow:0 15px 60px #1f33424d}dialog::backdrop{background:#24384b55}dialog h2{font-size:19px;margin:0 0 8px}dialog p{font-size:13px;color:#637187}dialog select{width:100%;border:1px solid #bcc8d7;border-radius:5px;padding:10px;margin:12px 0}dialog .actions{justify-content:flex-end}dialog .synthetic{color:#926d29;background:#fff8e9;border:1px solid #e8dab5;padding:9px 12px;font-size:12px;border-radius:5px}.saved-parent{font-size:11px;color:#7a8796;margin:6px 0 0}.report-copy{width:100%;min-height:180px;font:12px/1.5 Consolas,monospace;padding:10px;border:1px solid #c9d2de;resize:vertical}.probe{color:#7d8b9d;font-size:11px}@media(max-width:950px){.app{margin:10px}.layout{grid-template-columns:290px minmax(0,1fr)}.inputs{padding:21px 18px}.results{padding:24px}.local{display:none}}@media(max-width:700px){.app{margin:0;border-radius:0}.layout{grid-template-columns:1fr}.inputs{border-right:0;border-bottom:1px solid var(--line)}.results{min-height:500px}.navigation{padding:0 9px}.navigation button{padding:12px 9px}header{padding:15px}.inputs-bottom{display:none}.facts{gap:10px}.result-heading h1{font-size:21px}.header-right .quiet{font-size:11px}.results{padding:24px 20px}.badge{white-space:normal}}

<body>
<main class="app">
<header><div class="brand"><div class="mark" aria-hidden="true">↗</div><div><strong>brz2obsidian</strong><div class="sub">Your archive, ready for Obsidian</div></div></div><div class="header-right"><span class="local">Local · Offline</span><button id="close" class="quiet">Close window</button></div></header>
<nav class="navigation" aria-label="Operations"><button data-mode="convert" aria-selected="true">Convert archive</button><button data-mode="inspect" aria-selected="false">Inspect archive</button><button data-mode="check" aria-selected="false">Check vault</button></nav>
<div class="layout"><aside class="inputs" id="inputs" aria-label="Operation inputs"></aside><section class="results" id="results" aria-label="Results"></section></div>
</main>
<dialog id="picker"><div id="pickerbody"></div></dialog>
<script>
'use strict';
const scenarios=['start','review-clean','review-warnings','destination','running','success','success-warnings','refused','failed','leftover','changed','published-error','unknown','checker-clean','checker-issues','checker-failed'];
const params=new URLSearchParams(location.search);
const scenario=scenarios.includes(params.get('scenario'))?params.get('scenario'):'start';
const initialMode=['convert','inspect','check'].includes(params.get('mode'))?params.get('mode'):(scenario.startsWith('checker-')?'check':'convert');
const state={mode:initialMode,status:scenario,source:scenario==='start'?'':'C:\\Exports\\Garden.brz',sourceName:'Garden.brz',sourceKind:scenario.includes('warnings')?'warnings':'clean',parent:'C:\\Vaults',name:'Garden',vault:scenario==='start'?'':'C:\\Vaults\\Garden',inspection:scenario==='start'||scenario==='changed'?null:(scenario.includes('warnings')?'warnings':'clean'),destKind:scenario==='unknown'?'unknown':['success','success-warnings','published-error'].includes(scenario)?'populated':'absent',message:'',busy:false,op:'',elapsed:0,closeQueued:false,unknownChecked:false,lastParent:'C:\\Vaults',operationMode:initialMode,checkKind:scenario.startsWith('checker-')?scenario:'checker-clean'};
if(scenario==='refused'||scenario==='failed')state.inspection=null;
let timeout,interval;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=()=>state.parent.replace(/[\\/]+$/,'')+'\\'+state.name;
const published=()=>['success','success-warnings','published-error'].includes(state.status);
function nameError(){if(!state.name.trim())return'Enter a vault name.';if(/[<>:"/\\|?*\x00-\x1f]/.test(state.name)||/[. ]$/.test(state.name)||/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$/i.test(state.name)||['.','..'].includes(state.name))return'Use a valid Windows folder name.';return'';}
function parentError(){return /^[A-Za-z]:\\/.test(state.parent)||/^\\\\[^\\]+\\[^\\]+/.test(state.parent)?'':'Choose an absolute destination parent folder.';}
function destinationLocked(){return published()||state.destKind==='unknown';}
function destinationNote(){return state.destKind==='unknown'?'Destination contents are unknown. Review this destination before retrying.':state.destKind==='populated'?'This folder contains files. Choose another destination.':'Absent or empty folder required. Final checks run during conversion.';}
function canConvert(){return !!state.source&&['clean','warnings'].includes(state.inspection)&&!state.busy&&!nameError()&&!parentError()&&state.destKind!=='populated'&&state.destKind!=='unknown'&&state.status!=='unknown';}
function detailsText(){return ['brz2obsidian — synthetic diagnostic report','Prototype B · illustration only','Operation: '+(state.status.startsWith('checker-')?'Check vault':['review-clean','review-warnings','destination','refused','failed','changed'].includes(state.status)?'Inspect archive':'Convert archive'), 'Source: '+(state.source||'None selected'),'Destination: '+(state.mode==='check'?state.vault:path()),'Outcome: '+state.status,'Publication: '+(published()?'Verified synthetic receipt':state.status==='unknown'?'Unknown — destination review required':'No verified publication reported'),'Version: prototype; converter version unavailable',state.status==='leftover'?'Reported leftover: C:\\Vaults\\.Garden.staging-demo-001':'',state.status.includes('warnings')?'Warnings: 2 illustrative missing attachments; source archive unchanged.':'',state.status==='published-error'?'Follow-up error: synthetic source handle teardown failed after verified publication.':'',state.status==='checker-issues'?'Checker findings: 1 missing expected property; 1 broken local link.':'',state.status==='checker-failed'?'Checker error: synthetic permission denial reading vault metadata.':'','Diagnostic boundary: selected paths, aggregate findings and operation metadata only.','No archive payloads or note bodies included.'].filter(Boolean).join('\n');}
function renderInputs(){const disabled=state.busy?' disabled':'';const destinationDisabled=state.busy||destinationLocked()?' disabled':'';const sourceDisabled=state.busy||state.destKind==='unknown'?' disabled':'';const checker=state.mode==='check';$('inputs').innerHTML=checker?`<section><p class="eyebrow">Read-only operation</p><h2>Vault to check</h2><p class="help">Check an existing vault for convention issues. No files are changed.</p><div class="filebox"><div class="filetitle">${state.vault?'Garden':'No vault selected'}</div><div class="path">${esc(state.vault||'Choose an existing vault folder')}</div></div><button class="wide" data-action="pick-vault"${disabled}>Choose vault folder…</button><button class="wide primary" style="margin-top:10px" data-action="check"${disabled||(!state.vault?' disabled':'')}>Check vault</button></section><div class="inputs-bottom">Checking reports issues in its defined scope. It does not repair files or prove content preservation.</div>`:`<section><p class="eyebrow">Archive</p><h2>Source BRZ archive</h2><p class="help">The original archive stays unchanged.</p><div class="filebox"><div class="filetitle">${state.source?esc(state.sourceName):'No archive selected'}</div><div class="path">${esc(state.source||'Choose a .brz export to begin')}</div>${state.inspection?`<span class="tag">${state.inspection==='warnings'?'⚠ Reviewed · warnings':'✓ Inspection complete'}</span>`:''}</div><button class="wide" data-action="pick-source"${sourceDisabled}>Choose archive…</button><button class="wide ${state.inspection?'':'primary'}" style="margin-top:9px" data-action="inspect"${sourceDisabled||(!state.source?' disabled':'')}>${state.inspection?'Inspect again':'Inspect archive'}</button></section>${state.mode==='convert'?`<section><p class="eyebrow">Destination</p><h2>New Obsidian vault</h2><div class="field"><label for="parent">Parent folder</label><div class="inputrow"><input id="parent" value="${esc(state.parent)}"${destinationDisabled}><button data-action="pick-parent" aria-label="Choose destination parent folder"${destinationDisabled}>…</button></div><div id="parenterror" class="error">${parentError()}</div><p class="saved-parent">Last parent remembered in this demo session.</p></div><div class="field"><label for="name">Vault name</label><input id="name" value="${esc(state.name)}"${destinationDisabled}><div id="nameerror" class="error">${nameError()}</div></div><div class="preview"><strong>Complete destination path</strong><div class="path" id="fullpath">${esc(path())}</div></div><p class="destnote" id="destnote">${destinationNote()}</p><button id="convert" class="wide primary" data-action="convert"${canConvert()?'':' disabled'}>${state.inspection==='warnings'?'Convert with warnings':'Convert'}</button>${!state.inspection?'<p class="help">Review a usable inspection before converting.</p>':''}</section>`:'<section class="notice">Inspection does not need a destination. You can carry these findings into conversion after reviewing them.</section>'}<div class="inputs-bottom">Synthetic prototype · no real file access.<br>Only the last parent folder is remembered in memory.</div>`;}
const summary=(kind,symbol,title,body)=>`<div class="summary ${kind}"><div class="symbol" aria-hidden="true">${symbol}</div><div><h2>${title}</h2><p>${body}</p></div></div>`;
const metrics=()=>`<div class="facts"><div class="fact"><strong>128</strong><span>thoughts</span></div><div class="fact"><strong>246</strong><span>relationships</span></div><div class="fact"><strong>34</strong><span>attachments</span></div></div><div class="probe">Illustrative counts from a synthetic archive.</div>`;
const findings=()=>`<h3 class="sectiontitle">Warnings to review</h3><div class="finding"><span class="dot" aria-hidden="true">!</span><div><strong>2 attachments are unavailable</strong><p>References will be recorded in the migration report. Their files cannot be included.</p></div></div>`;
const destinationLine=()=>`<div class="destinationline"><small>${published()?'Published vault':'Selected destination'}</small><div class="path">${esc(path())}</div></div>`;
function completionActions(){return`<div class="actions"><button data-action="open-folder">Open folder</button><button data-action="open-report">Open migration report</button><button data-action="open-obsidian">Open in Obsidian</button><button data-action="post-check">Check vault</button></div><div class="actions"><button class="quiet" data-action="new-conversion">Start another conversion</button></div>`;}
function renderResults(){let content='',title=state.mode==='check'?'Vault check':state.mode==='inspect'?'Archive inspection':'Conversion workspace';let badge=state.busy?'Operation active':'Ready';const s=state.status;
if(state.busy){title=state.op;badge='Running';content=summary('','<div class="spinner"></div>',state.op+'…','Keep this window open. Your inputs stay fixed until the operation finishes.')+`<div class="busyline"><span>Working locally</span></div><div class="elapsed" id="elapsed">Elapsed ${state.elapsed}s</div><p class="notice">One operation at a time. Closing is deferred until this operation finishes.</p>`;}
else if(s==='start'){content=`<div class="empty"><div><div class="empty-icon" aria-hidden="true">${state.mode==='check'?'⌕':'↗'}</div><h2>${state.mode==='check'?'Choose a vault to check':'Start with your BRZ archive'}</h2><p>${state.mode==='check'?'Select an existing vault folder on the left. Findings will appear here.':'Select an archive on the left, then inspect it. Review the findings here before creating a vault.'}</p></div></div>`;}
else if(['review-clean','review-warnings','destination'].includes(s)){badge='Inspection complete';content=summary(state.inspection==='warnings'?'warn':'success',state.inspection==='warnings'?'!':'✓',state.inspection==='warnings'?'Ready to convert with warnings':'Archive inspected',state.inspection==='warnings'?'Review the warning below. Conversion requires the explicit “Convert with warnings” action.':'The archive can be converted. Review the planned content and destination before starting.')+metrics()+(state.inspection==='warnings'?findings():'<h3 class="sectiontitle">No inspection warnings</h3><p class="help">Planned content is ready for conversion.</p>')+'<p class="notice">Inspection checks the archive. Destination access, source freshness and publication safety are checked again during conversion.</p>'+(state.mode==='inspect'?'<div class="actions"><button class="primary" data-action="to-convert">Convert this archive</button></div>':'');}
else if(published()){badge='Vault created';content=summary(s==='success'?'success':'warn',s==='success'?'✓':'!',s==='published-error'?'Vault created; a follow-up error occurred':s==='success-warnings'?'Vault created with warnings':'Vault created',s==='published-error'?'Publication is verified. An error occurred afterward while releasing the source archive.':s==='success-warnings'?'Publication is verified. Two missing attachments are recorded in the migration report.':'Publication is verified. Your new vault is ready to open.')+destinationLine()+(s==='success-warnings'?findings():'')+(s==='published-error'?'<p class="notice">The published vault remains available. Do not retry into this populated destination. Review the diagnostics for the follow-up error.</p>':'<p class="help">Opening an application and checking the vault are optional.</p>')+completionActions();}
else if(s==='changed'){badge='Reinspection required';content=summary('warn','!','The archive changed','The selected archive no longer matches the inspection you reviewed. Publication is blocked.')+'<p class="notice">Inspect the archive again and review the new findings. Any previous warning acknowledgment is no longer valid.</p><div class="actions"><button class="primary" data-action="inspect">Inspect changed archive</button></div>';}
else if(s==='unknown'){badge='Publication unknown';content=summary('warn','?','Could not confirm publication','The operation ended without a trustworthy final result. We cannot tell whether the vault was published.')+destinationLine()+'<p class="notice">Check this destination before retrying. A folder’s existence alone does not establish successful publication. If it contains files, choose another destination.</p><div class="actions"><button class="primary" data-action="review-destination">Check destination before retrying…</button></div>';}
else if(s==='leftover'){badge='No verified publication';content=summary('bad','!','Conversion failed; a folder remains','The vault was not published. A temporary staging folder could not be removed.')+`<div class="destinationline"><small>Exact reported leftover folder</small><div class="path">C:\\Vaults\\.Garden.staging-demo-001</div></div><p class="notice">Review this folder in File Explorer before removing it yourself. Preserve anything needed for recovery. Cleanup may need permission changes. This app does not delete it or automatically retry.</p><div class="actions"><button data-action="copy-leftover">Copy leftover path</button><button data-action="retry">Validate and retry</button></div>`;}
else if(s==='refused'){badge='Blocked';content=summary('bad','!','Archive inspection refused','This synthetic archive uses an unsupported export structure. Conversion is blocked.')+'<p class="notice">Choose a supported BRZ export, then inspect it again. No vault has been created.</p><div class="actions"><button data-action="pick-source">Choose another archive…</button></div>';}
else if(s==='failed'){badge='Could not complete';content=summary('bad','!','Archive inspection failed','The synthetic archive could not be read. No usable inspection is available and conversion is blocked.')+'<p class="notice">Check access to the archive, then retry inspection. Selected inputs have been retained. No vault has been created.</p><div class="actions"><button data-action="inspect">Retry inspection</button><button data-action="pick-source">Choose another archive…</button></div>';}
else if(s.startsWith('checker-')){badge=s==='checker-failed'?'Check failed':'Check complete';content=summary(s==='checker-clean'?'success':s==='checker-issues'?'warn':'bad',s==='checker-clean'?'✓':'!',s==='checker-clean'?'Check completed with no issues':s==='checker-issues'?'Check completed; 2 issues found':'The check could not complete',s==='checker-clean'?'No issues were found in the checker’s scope.':s==='checker-issues'?'The vault remains available. These findings do not mean conversion failed.':'The checker could not read vault metadata. Check folder permissions and try again.')+`<div class="destinationline"><small>Checked vault · read-only</small><div class="path">${esc(state.vault)}</div></div>`+(s==='checker-issues'?'<h3 class="sectiontitle">Findings</h3><div class="finding"><span class="dot">!</span><div><strong>1 note is missing an expected property</strong><p>Review the file’s metadata against the vault conventions.</p></div></div><div class="finding"><span class="dot">!</span><div><strong>1 local link has no target</strong><p>Review the link and restore its target if appropriate.</p></div></div>':'')+'<p class="notice">Checking is read-only. No repairs were made. A clean result does not prove content preservation.</p>'+(s==='checker-failed'?'<div class="actions"><button class="primary" data-action="check">Retry check</button></div>':'');}
else if(s==='conversion-failed'){badge='No verified publication';content=summary('bad','!','Conversion failed','The destination could not be written. No verified publication was reported.')+destinationLine()+'<p class="notice">Check destination permissions or choose another parent. Inputs are retained. Retry is always your choice.</p><div class="actions"><button data-action="retry">Validate and retry</button></div>';}
else if(s==='destination-refused'){badge='Destination blocked';content=summary('bad','!','Choose an empty destination','This folder contains files. Conversion cannot overwrite, merge or synchronize it.')+destinationLine()+'<p class="notice">Use another vault name or choose another parent folder. Existing contents are preserved.</p>';}
const diagnostics=state.busy||s==='start'?'':`<details class="details"><summary>Diagnostic details</summary><pre>${esc(detailsText())}</pre><div class="report-actions"><button data-action="copy-details">Copy details</button><button data-action="save-details">Save diagnostic report</button></div></details>`;
$('results').innerHTML=`<div class="result-heading"><div><p class="eyebrow">${state.mode==='check'?'Read-only check':state.source?esc(state.sourceName)+' · local workspace':'Local workspace'}</p><h1>${title}</h1></div><span class="badge">${badge}</span></div><div aria-live="polite">${content}</div>${diagnostics}${state.message?`<div class="toast" role="status">${esc(state.message)}</div>`:''}<div class="bottomhint">Synthetic example · no archive payloads or note bodies · no actual conversion</div>`;}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.disabled=state.busy;b.setAttribute('aria-selected',String(b.dataset.mode===state.mode));});renderInputs();renderResults();if(window.parent!==window)window.parent.postMessage({type:'prototype-state',variant:'B',mode:state.mode,status:state.status,scenario:state.busy?'running':scenarios.includes(state.status)?state.status:state.status==='destination-refused'?'refused':state.status==='conversion-failed'?'failed':'start'},'*');}
function refreshValidation(){const n=$('nameerror'),p=$('parenterror');if(n)n.textContent=nameError();if(p)p.textContent=parentError();if($('fullpath'))$('fullpath').textContent=path();if($('convert'))$('convert').disabled=!canConvert();if($('destnote'))$('destnote').textContent=destinationNote();}
function busy(op,next){if(state.busy)return;state.busy=true;state.op=op;state.operationMode=state.mode;state.elapsed=0;state.message='';render();interval=setInterval(()=>{state.elapsed++;if($('elapsed'))$('elapsed').textContent='Elapsed '+state.elapsed+'s';},1000);timeout=setTimeout(()=>{clearInterval(interval);state.busy=false;next();if(state.closeQueued){state.message='Operation finished. The window would now close. This prototype stays open.';state.closeQueued=false;}render();},4000);}
function inspect(){if(!state.source||state.busy||state.destKind==='unknown')return;busy('Inspecting archive',()=>{state.inspection=['clean','warnings'].includes(state.sourceKind)?state.sourceKind:null;state.status=state.sourceKind==='clean'?'review-clean':state.sourceKind==='warnings'?'review-warnings':state.sourceKind==='refused'?'refused':'failed';});}
function convert(){if(!canConvert())return;state.lastParent=state.parent;busy('Converting archive',()=>{state.destKind='populated';state.vault=path();state.status=state.inspection==='warnings'?'success-warnings':'success';});}
function check(){if(!state.vault||state.busy)return;busy('Checking vault',()=>{state.status=state.checkKind||'checker-clean';});}
function dialog(title,description,body,buttons){$('pickerbody').innerHTML=`<h2>${title}</h2><div class="synthetic">Synthetic picker · no files or folders are accessed.</div><p>${description}</p>${body}<div class="actions">${buttons}<button data-action="dismiss">Back</button></div>`;$('picker').showModal();}
function pickSource(){if(state.destKind==='unknown')return;dialog('Choose a BRZ archive','Choose a synthetic archive example. All paths and findings are illustrative.','<label for="pick">Archive example</label><select id="pick"><option value="clean">Garden.brz — clean inspection</option><option value="warnings">Garden.brz — missing attachments</option><option value="refused">Garden.brz — unsupported structure</option><option value="failed">Garden.brz — read error</option><option value="alternate">Meadow.brz — different archive</option></select>','<button class="primary" data-action="source-chosen">Use this archive</button>');}
function switchMode(mode){if(state.busy)return;state.mode=mode;state.message='';if(mode==='check'){if(!state.status.startsWith('checker-'))state.status='start';}else if(state.status.startsWith('checker-')||state.status==='start'){state.status=state.inspection?(state.inspection==='warnings'?'review-warnings':'review-clean'):'start';}if(mode!=='check'&&state.destKind==='unknown')state.status='unknown';state.operationMode=mode;render();}
async function copy(text,label){try{await navigator.clipboard.writeText(text);state.message=label+' copied. Synthetic text only.';render();}catch{dialog('Copy '+label.toLowerCase(),'Clipboard access is unavailable here. Select and copy the synthetic text below.',`<textarea class="report-copy" readonly>${esc(text)}</textarea>`,'');}}
document.addEventListener('input',e=>{if(state.busy||destinationLocked())return;if(e.target.id==='name'||e.target.id==='parent'){state[e.target.id]=e.target.value;state.destKind='absent';refreshValidation();}});
document.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button||button.disabled)return;const action=button.dataset.action;if(button.dataset.mode){switchMode(button.dataset.mode);return;}if(button.id==='close'){state.message=state.busy?'Closure deferred. This window stays open until the active operation finishes.':'The window would close now. This synthetic prototype stays open.';state.closeQueued=state.busy;renderResults();return;}if(state.busy)return;
switch(action){case'pick-source':pickSource();break;case'dismiss':$('picker').close();break;case'source-chosen':{const selected=$('pick').value;state.sourceKind=selected==='alternate'?'clean':selected;state.sourceName=selected==='alternate'?'Meadow.brz':'Garden.brz';state.source='C:\\Exports\\'+state.sourceName;state.name=state.sourceName.replace(/\.brz$/,'');state.inspection=null;state.status='start';state.message='Archive selected. Inspect it to see the findings.';state.destKind='absent';$('picker').close();render();break;}case'inspect':inspect();break;case'convert':convert();break;case'check':check();break;case'to-convert':switchMode('convert');break;case'new-conversion':state.mode='convert';state.status=state.inspection==='warnings'?'review-warnings':'review-clean';state.message='Choose another vault name or parent folder for a new conversion. The published vault is unchanged.';render();break;case'post-check':state.vault=path();state.checkKind='checker-clean';state.mode='check';state.status='start';render();check();break;
case'pick-parent':dialog('Choose a destination parent','The last selected parent is remembered only in this page’s memory.','<label for="pick">Synthetic parent folder</label><select id="pick"><option>C:\\Vaults</option><option>C:\\Exports\\Converted</option><option>D:\\Notes</option></select><label for="folderkind">Resulting folder condition</label><select id="folderkind"><option value="absent">Destination does not exist</option><option value="empty">Destination exists and is empty</option><option value="populated">Destination contains files</option></select>','<button class="primary" data-action="parent-chosen">Use this parent</button>');break;
case'parent-chosen':state.parent=$('pick').value;state.lastParent=state.parent;state.destKind=$('folderkind').value;$('picker').close();if(state.destKind==='populated')state.status='destination-refused';else if(state.status==='destination-refused')state.status=state.inspection==='warnings'?'review-warnings':'review-clean';state.message='Synthetic folder selected. No filesystem validation was performed.';render();break;
case'pick-vault':dialog('Choose an existing vault','This is a read-only check of a synthetic folder.','<label for="pick">Synthetic vault example</label><select id="pick"><option value="checker-clean">C:\\Vaults\\Garden — no issues</option><option value="checker-issues">C:\\Vaults\\Garden — convention issues</option><option value="checker-failed">C:\\Vaults\\Garden — permission error</option></select>','<button class="primary" data-action="vault-chosen">Use this vault</button>');break;
case'vault-chosen':state.vault='C:\\Vaults\\Garden';state.checkKind=$('pick').value;state.status='start';$('picker').close();state.message='Vault selected. Choose Check vault when ready.';render();break;
case'open-folder':state.message='Simulated: File Explorer would open '+path()+'. No application was launched.';render();break;case'open-report':state.message='Simulated: migration report would open at '+path()+'\\MIGRATION REPORT.md. No file was opened.';render();break;case'open-obsidian':state.message='Simulated: Obsidian is unavailable. Your published vault is unchanged. Copy and open this folder manually: '+path();render();break;
case'copy-leftover':await copy('C:\\Vaults\\.Garden.staging-demo-001','Leftover path');break;case'copy-details':await copy(detailsText(),'Diagnostic details');break;case'save-details':{const blob=new Blob([detailsText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='brz2obsidian-synthetic-diagnostic.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);state.message='Synthetic diagnostic report offered as a local text download. No upload or automatic history.';render();break;}
case'retry':if(!state.inspection){inspect();}else if(canConvert()){convert();}else{state.message='Review a usable inspection and choose an absent or empty destination before retrying.';render();}break;
case'review-destination':dialog('Review the destination before retrying','In the real app, review the exact destination. Folder existence alone is not proof that publication succeeded. This demo records your review without accessing disk.',`<div class="path">${esc(path())}</div><label for="pick">Synthetic review result</label><select id="pick"><option value="populated">The folder contains files</option><option value="absent">The folder is absent or empty</option><option value="unknown">I cannot establish its contents</option></select>`,'<button class="primary" data-action="destination-reviewed">Record review</button>');break;
case'destination-reviewed':{const value=$('pick').value;$('picker').close();if(value==='unknown'){state.message='Publication remains unknown. Resolve destination access before retrying.';}else{state.unknownChecked=true;state.destKind=value;state.status=value==='populated'?'destination-refused':state.inspection==='warnings'?'review-warnings':'review-clean';state.message=value==='populated'?'Destination reviewed: it contains files. Choose a new destination; publication has not been inferred.':'Destination reviewed: absent or empty. You may validate and retry. Previous publication status has not been inferred.';}render();break;}}
});
render();
if(scenario==='running')busy(state.mode==='inspect'?'Inspecting archive':state.mode==='check'?'Checking vault':'Converting archive',()=>{if(state.mode==='inspect'){state.inspection='clean';state.status='review-clean';}else if(state.mode==='check'){state.status='checker-clean';}else{state.status='success';state.destKind='populated';state.vault=path();}});
</script>
</body>
</html>
