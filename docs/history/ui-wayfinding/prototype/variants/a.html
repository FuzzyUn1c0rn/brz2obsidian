<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>BRZ to Obsidian — guided prototype</title>
<style>
:root{font:15px/1.5 "Segoe UI",Arial,sans-serif;color:#26313c;background:#eef1f4;--accent:#246292;--line:#d8dfe6}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #b9c6d2;border-radius:5px;background:white;color:#25384a;padding:8px 15px}button:hover{background:#edf4fa}button:focus-visible,input:focus-visible{outline:3px solid #83b5dc;outline-offset:2px}button:disabled{opacity:.48;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#194c74}.warning-button{background:#845213;color:white;border-color:#845213}.app{max-width:1080px;min-height:680px;margin:28px auto;background:white;border:1px solid #cdd6de;border-radius:9px;box-shadow:0 8px 32px #34445512;overflow:hidden}header{display:flex;align-items:center;gap:12px;padding:17px 24px;border-bottom:1px solid var(--line)}.logo{display:grid;place-items:center;background:#e5eff8;color:#246292;border-radius:7px;font-weight:700;width:36px;height:36px}header strong{font-size:17px}header small{display:block;color:#627283;font-size:12px}header .close{margin-left:auto;border:0;color:#526476}.modes{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--line)}.modes button{padding:13px 2px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none}.modes .selected{border-color:var(--accent);font-weight:600;color:var(--accent)}.body{display:grid;grid-template-columns:230px 1fr;min-height:535px}.rail{padding:28px 24px;background:#f7f9fb;border-right:1px solid var(--line)}.rail-label{text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:700;color:#718092;margin-bottom:20px}.step{display:flex;align-items:center;gap:10px;padding:11px 0;color:#6a7987}.step b{display:grid;place-items:center;width:25px;height:25px;border:1px solid #b8c4cf;border-radius:50%;font-weight:500;font-size:12px}.step.current{color:#1e5681;font-weight:600}.step.current b{color:white;background:#246292;border-color:#246292}.step.done b{background:#e4eee9;color:#37684f;border-color:#bdd5c7}.rail p{font-size:12px;color:#6c7b89;line-height:1.6;margin-top:30px}.content{padding:31px 36px 26px;min-width:0}.eyebrow{color:#62788b;font-size:12px;margin-bottom:5px}h1{font-size:25px;font-weight:600;line-height:1.3;margin:0 0 10px}h2{font-size:16px;margin:0 0 6px}p{margin:0 0 18px}.muted{color:#617182}.field{margin:23px 0}.field label{display:block;font-weight:600;margin-bottom:7px}.field-row{display:flex;gap:9px}.field-row input{flex:1;min-width:0}.field input{width:100%;padding:9px 11px;border:1px solid #aebdcb;border-radius:4px;background:white}.field input[readonly]{background:#f7f9fb;color:#536575}.hint{font-size:12px;color:#687b8b;margin-top:6px}.error{color:#9d302e;font-size:13px;margin-top:6px}.path{overflow-wrap:anywhere;font-family:Consolas,monospace;font-size:13px;background:#f3f6f8;padding:11px 13px;border-radius:4px;margin:8px 0 18px}.panel{padding:17px 18px;border:1px solid #d9e2e9;border-left:4px solid #8ba7be;background:#f7f9fb;border-radius:4px;margin:20px 0}.panel.warning{border-color:#e8d4af;border-left-color:#b7812d;background:#fff8e9}.panel.bad{border-color:#ebc7c5;border-left-color:#b24d46;background:#fdf4f3}.panel.good{border-color:#c8dfd0;border-left-color:#4c8863;background:#f1f8f3}.panel p:last-child{margin:0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0;padding:15px 0}.facts strong{display:block;font-size:24px;font-weight:600}.facts span{font-size:12px;color:#607285}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}.footer{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:11px 24px;border-top:1px solid var(--line);font-size:11px;color:#6a7d8d;background:#fafbfc}.footer .state{font-family:Consolas,monospace}details{margin-top:23px;border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;color:#365d7b;font-weight:600;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;color:#526272;background:#f7f9fb;padding:13px}.detail-actions{display:flex;gap:8px}.detail-actions button{font-size:12px;padding:6px 10px}.busy{display:flex;align-items:center;gap:12px;margin:33px 0}.spinner{width:24px;height:24px;border:3px solid #d5e4ef;border-top-color:#246292;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.notice{margin-top:17px;padding:10px 13px;background:#eaf2f8;border-radius:4px;font-size:13px;color:#284f6f}.notice:empty{display:none}dialog{border:1px solid #bcc9d4;border-radius:8px;max-width:490px;width:90%;padding:24px;box-shadow:0 20px 70px #10263833}dialog::backdrop{background:#26384965}dialog select,dialog input{display:block;width:100%;padding:9px;margin:14px 0;border:1px solid #aebdcb;border-radius:4px}dialog small{color:#687987;display:block;margin-bottom:16px}ul{padding-left:20px;margin:8px 0}.read-only{display:inline-block;padding:3px 7px;border-radius:3px;font-size:11px;background:#e9eff4;color:#536a7c;margin-bottom:14px}@media(max-width:760px){.app{margin:0;border-radius:0;min-height:100vh}.body{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;padding:10px 20px}.rail-label,.rail p{display:none}.step{font-size:12px;padding:0}.step b{width:21px;height:21px}.content{padding:25px 23px}.facts{gap:10px}.modes{gap:18px}.footer{align-items:flex-start}.field-row{flex-wrap:wrap}.field-row input{flex-basis:70%}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body><div class="app"><header><span class="logo">B</span><div><strong>BRZ to Obsidian</strong><small>Your archive, a new vault</small></div><button class="close" onclick="closeDemo()">Close</button></header><nav class="modes" aria-label="Operation"><button id="mode-convert" onclick="setMode('convert')">Create a vault</button><button id="mode-inspect" onclick="setMode('inspect')">Inspect archive</button><button id="mode-check" onclick="setMode('check')">Check vault</button></nav><div class="body"><aside class="rail" id="rail"></aside><main class="content" id="main"></main></div><footer class="footer"><span>Synthetic presentation prototype · no archive or vault is accessed</span><span class="state" id="state"></span></footer></div><dialog id="picker"><h2 id="picker-title"></h2><small>Prototype control — this stands in for a Windows file or folder picker. All paths and results are synthetic.</small><div id="picker-body"></div><div class="actions"><button onclick="document.getElementById('picker').close()">Cancel selection</button><button class="primary" onclick="pick()">Select</button></div></dialog>
<script>
// Variant A answers whether a single-stage guided workflow makes decisions and outcomes easier to follow.
const params=new URLSearchParams(location.search), scenarios=['start','review-clean','review-warnings','destination','running','success','success-warnings','refused','failed','leftover','changed','published-error','unknown','checker-clean','checker-issues','checker-failed'];
let scenario=scenarios.includes(params.get('scenario'))?params.get('scenario'):'start';
let mode=['convert','inspect','check'].includes(params.get('mode'))?params.get('mode'):'convert';
let stage='source',status='ready',source='',parent='C:\\Vaults',name='Garden',vault='',finding='clean',inspection=false,notice='',error='',busy=false,started=0,timer,finishTimer,pickerType='',deferred=false,unknownCheck=false,operation='convert',lastParent='C:\\Vaults';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function destination(){return parent.replace(/\\$/,'')+'\\'+name.trim()}
function path(s){return '<div class="path">'+esc(s)+'</div>'}
function button(text,fn,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+text+'</button>'}
function diag(){return 'BRZ to Obsidian — synthetic diagnostic report\nOperation: '+mode+'\nOutcome: '+status+'\nSource: '+(source||'Not selected')+'\nDestination: '+(vault||destination())+'\nExample versions: desktop prototype A; converter illustrative\n'+(status==='leftover'?'Leftover path: C:\\Vaults\\.Garden.staging-demo-001\n':'')+'Summary: '+({success:'Vault publication verified.', 'success-warnings':'Vault publication verified; 2 source-content warnings.','published-error':'Vault publication verified; report-opening follow-up failed.',unknown:'Worker response unavailable; publication status unknown.',changed:'Source differs from reviewed inspection; publication blocked.',leftover:'Write failed before publication; staging cleanup denied.',refused:'Destination is populated; conversion refused.',failed:'Write failed before publication; no verified publication reported.','checker-clean':'Check completed; no issues in checker scope.','checker-issues':'Check completed; 2 issues: a missing referenced asset and a changed support file.','checker-failed':'Check could not complete: selected folder is not readable.'}[status]||('Inspection finding: '+finding))+ '\nAll counts and paths are illustrative. No note bodies or archive payloads included.'}
function details(){return '<details><summary>Diagnostic details</summary><pre>'+esc(diag())+'</pre><div class="detail-actions">'+button('Copy details','copyDetails()')+button('Save diagnostic report','saveDetails()')+'</div></details>'}
function render(){
 ['convert','inspect','check'].forEach(m=>{$('mode-'+m).className=m===mode?'selected':'';$('mode-'+m).disabled=busy});
 const steps=mode==='convert'?['Archive','Review inspection','Destination','Create vault']:mode==='inspect'?['Archive','Inspection']:['Vault folder','Check results'];
 const idx=mode==='convert'?(stage==='running'&&operation==='inspect'?0:({source:0,review:1,destination:2,running:3,result:3}[stage])):stage==='source'?0:1;
 $('rail').innerHTML='<div class="rail-label">'+(mode==='convert'?'Create a vault':mode==='inspect'?'Inspect archive':'Check vault')+'</div>'+steps.map((s,i)=>'<div class="step '+(i===idx?'current':i<idx?'done':'')+'"><b>'+(i<idx?'✓':i+1)+'</b><span>'+s+'</span></div>').join('')+'<p>'+ (mode==='convert'?'Review the archive first.<br>Choose where the new vault belongs.<br>Create when you are ready.':mode==='inspect'?'Read the archive without creating a vault.': 'Check an existing vault without changing its files.')+'</p>';
 let h='';
 if(stage==='source'&&mode!=='check')h='<div class="eyebrow">'+(mode==='convert'?'Step 1 of 4':'Read-only inspection')+'</div><h1>Choose your BRZ archive</h1><p class="muted">Start with an export from TheBrain. We’ll inspect it before creating a vault.</p><div class="field"><label for="source">BRZ archive</label><div class="field-row"><input id="source" readonly value="'+esc(source)+'" placeholder="No archive selected">'+button('Browse…',"showPicker('source')")+'</div></div><p class="hint">Inspection leaves the source archive unchanged.</p><div class="actions"><button class="primary" '+(!source?'disabled':'')+' onclick="inspect()">Inspect archive</button></div>';
 if(stage==='source'&&mode==='check')h='<span class="read-only">Read-only</span><h1>Check an existing vault</h1><p class="muted">Look for issues in the generated vault’s conventions and supporting files.</p><div class="field"><label for="vault">Vault folder</label><div class="field-row"><input id="vault" readonly value="'+esc(vault)+'" placeholder="No folder selected">'+button('Browse…',"showPicker('vault')")+'</div></div><p class="hint">Checking does not repair files or prove that all source content was preserved.</p><div class="actions"><button class="primary" '+(!vault?'disabled':'')+' onclick="check()">Check vault</button></div>';
 if(stage==='review'){
 const bad=finding==='refused'||finding==='failed';
 h='<div class="eyebrow">'+(mode==='convert'?'Step 2 of 4':'Inspection results')+'</div><h1>'+(bad?(finding==='refused'?'This archive cannot be converted':'Inspection could not complete'):finding==='warnings'?'Ready, with warnings':'Your archive is ready')+'</h1>'+path(source)+'<div class="panel '+(bad?'bad':finding==='warnings'?'warning':'good')+'"><h2>'+(bad?'A usable inspection is required':finding==='warnings'?'2 warnings to review':'Inspection completed')+'</h2><p>'+(finding==='refused'?'The archive structure is unsupported. Choose another BRZ export.':finding==='failed'?'The archive could not be read. Check access and select it again.':finding==='warnings'?'2 source notes are unavailable. The new vault will include notices where content is missing.':'No inspection warnings were found.')+'</p></div>'+(bad?'':'<div class="facts"><div><strong>148</strong><span>planned notes</span></div><div><strong>26</strong><span>planned resources</span></div><div><strong>4</strong><span>categories</span></div></div><p class="hint">Illustrative counts. Destination access and final source validation are checked when converting.</p>')+'<div class="actions">'+button('Choose another archive',"resetSource()")+(bad?'':button(mode==='inspect'?'Convert this archive':'Choose destination',"toDestination()",true))+'</div>'+details();
 }
 if(stage==='destination')h='<div class="eyebrow">Step 3 of 4</div><h1>Where should the vault go?</h1><p class="muted">Choose a parent folder and a name for the new vault.</p><div class="field"><label for="parent">Parent folder</label><div class="field-row"><input id="parent" readonly value="'+esc(parent)+'">'+button('Browse…',"showPicker('parent')")+'</div><div class="hint">Last parent remembered for this demo session only.</div><div class="error" id="parent-error"></div></div><div class="field"><label for="name">Vault name</label><input id="name" value="'+esc(name)+'" oninput="setVaultName(this.value)" aria-describedby="name-error"><div class="error" id="name-error">'+esc(error)+'</div></div><label>Complete destination</label><div class="path" id="full-path">'+esc(destination())+'</div><p class="hint">The destination must be absent or empty. A folder containing files cannot be used.</p>'+(finding==='warnings'?'<div class="panel warning"><h2>Continue with 2 inspection warnings</h2><p>The vault will contain notices for unavailable source notes.</p></div>':'')+'<div class="actions">'+button('Back to inspection',"stage='review';notice='';render()")+'<button id="convert" class="'+(finding==='warnings'?'warning-button':'primary')+'" onclick="convert()">'+(finding==='warnings'?'Convert with warnings':'Convert')+'</button></div>';
 if(stage==='running')h='<div class="eyebrow">'+(mode==='convert'?(operation==='inspect'?'Step 1 of 4':'Step 4 of 4'):'Operation in progress')+'</div><h1>'+(operation==='convert'?'Creating your vault':operation==='inspect'?'Inspecting the archive':'Checking the vault')+'</h1>'+path(operation==='check'?vault:operation==='convert'?destination():source)+'<div class="busy" role="status"><span class="spinner" aria-hidden="true"></span><div><strong>'+(operation==='convert'?'Conversion is running':operation==='inspect'?'Inspection is running':'Check is running')+'</strong><div class="muted">Elapsed <span id="elapsed">'+Math.floor((Date.now()-started)/1000)+'</span> seconds</div></div></div><p class="muted">You can keep this window open while the operation finishes.</p><p class="hint">One operation at a time. Closing is deferred until this operation completes.</p>';
 if(stage==='result')h=result();
 $('main').innerHTML=h+'<div class="notice" role="status" id="notice">'+esc(notice)+'</div>';
 $('state').textContent=mode+' · '+status;
 if(stage==='destination')updateDestination();
 const shownScenario=stage==='source'?'start':stage==='running'?'running':stage==='destination'?'destination':stage==='review'&&['clean','warnings'].includes(finding)?(finding==='warnings'?'review-warnings':'review-clean'):scenarios.includes(status)?status:scenario;if(window.parent!==window)window.parent.postMessage({type:'prototype-state',variant:'A',mode,status,scenario:shownScenario},'*');
 }
function result(){
 const published=['success','success-warnings','published-error'].includes(status),checker=status.startsWith('checker-');
 const titles={success:'Your vault is ready','success-warnings':'Vault created with warnings','published-error':'Vault created; a follow-up error occurred',refused:'Conversion could not proceed',failed:'Conversion failed',leftover:'Conversion failed; a folder remains',changed:'The archive has changed',unknown:'Publication status is unknown','checker-clean':'Check completed — no issues','checker-issues':'Check completed — 2 issues','checker-failed':'The check could not complete'};
 const summaries={success:'The new vault was published and verified. Choose an optional next step.','success-warnings':'Publication was verified. 2 unavailable source notes have notices in the vault. Review the migration report.','published-error':'Publication was verified, but a later follow-up could not open the migration report. Your created vault remains available.',refused:'The destination already contains files. Choose another name or an empty destination.',failed:'A write error stopped the operation. No verified publication was reported. Check disk space and destination access before trying again.',leftover:'A write error stopped the operation before publication. Cleanup could not remove the reported staging folder.',changed:'Publication was blocked because the archive differs from the inspection you reviewed. Inspect it again and review the new findings before conversion.',unknown:'The worker did not return a trustworthy final result. Check the destination before attempting another conversion. Folder existence alone does not establish success.','checker-clean':'No issues were found within the checker’s scope. This does not prove preservation of every source item.','checker-issues':'The check finished and found a missing referenced asset and a changed support file. Review the details before making any manual changes.','checker-failed':'The selected vault folder could not be read. Check folder access before retrying.'};
 let h=(checker?'<span class="read-only">Read-only · no repairs made</span>':'<div class="eyebrow">'+(published?'Conversion complete':'Conversion outcome')+'</div>')+'<h1>'+titles[status]+'</h1><div class="panel '+(status==='success'||status==='checker-clean'?'good':status==='success-warnings'||status==='checker-issues'||status==='published-error'||status==='unknown'?'warning':'bad')+'"><p>'+summaries[status]+'</p></div>'+path(checker?vault:destination());
 if(status==='leftover')h+='<h2>Reported leftover folder</h2>'+path('C:\\Vaults\\.Garden.staging-demo-001')+'<p class="hint">Inspect this exact folder in File Explorer. Remove it manually only after confirming it is an unwanted staging folder. No files are deleted by this app.</p>';
 h+='<div class="actions">';
 if(published)h+=button('Open folder',"openAction('folder')")+button('Open migration report',"openAction('report')")+button('Open in Obsidian',"openAction('obsidian')")+button('Check vault',"checkPublished()",true);
 else if(status==='changed')h+=button('Inspect again','inspect()',true);
 else if(status==='unknown')h+=button('Check destination','checkUnknown()',true);
 else if(checker)h+=(status==='checker-failed'?button('Retry check','check()',true):'')+button('Choose another vault',"vault='';stage='source';notice='';render()")+(unknownCheck?button('Choose a new destination','afterUnknown()',true):'');
 else h+=button('Review destination','reviewDestination()',true)+button('Inspect archive again','inspect()');
 h+='</div>';
 if(published)h+='<div class="actions">'+button('Create another vault',"newVault()")+'</div>';
 return h+details();
}
function setMode(m){if(busy)return;mode=m;stage='source';status='ready';notice='';error='';unknownCheck=false;if(m==='convert'&&inspection)stage='review';render()}
function resetSource(){source='';inspection=false;stage='source';status='ready';notice='';render()}
function toDestination(){mode='convert';stage='destination';status='ready';notice='';render()}
function setVaultName(value){name=value;updateDestination()}
function validName(){let n=name.trim();return !n?'Enter a vault name.':/[<>:"/\\|?*\x00-\x1f]/.test(n)||/[. ]$/.test(name)||/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i.test(n)||n==='.'||n==='..'?'Use a valid Windows folder name.':''}
function updateDestination(){const nameError=validName(),parentError=parent==='C:\\Populated'?'This destination contains files. Choose another parent folder.':'';error=nameError||parentError;$('full-path').textContent=destination();$('name-error').textContent=nameError;$('parent-error').textContent=parentError;$('name').setAttribute('aria-invalid',!!nameError);$('convert').disabled=!!error||!inspection}
function inspect(){if(busy||!source)return;inspection=false;startRun('inspect',()=>{stage='review';status=finding==='warnings'?'review-warnings':finding==='clean'?'review-clean':'inspect-'+finding;inspection=['clean','warnings'].includes(finding);render()})}
function convert(){updateDestination();if(error||!inspection||busy)return;lastParent=parent;startRun('convert',()=>{status=finding==='warnings'?'success-warnings':'success';stage='result';render()})}
function check(){if(!vault||busy)return;startRun('check',()=>{status=finding==='issues'?'checker-issues':finding==='failed'?'checker-failed':'checker-clean';stage='result';render()})}
function startRun(op,done){operation=op;busy=true;stage='running';status='running';notice='';started=Date.now();render();timer=setInterval(()=>{if($('elapsed'))$('elapsed').textContent=Math.floor((Date.now()-started)/1000)},500);finishTimer=setTimeout(()=>{clearInterval(timer);busy=false;done();if(deferred){notice='The operation has finished. Your deferred close request can now complete. This prototype stays open so you can review the result.';deferred=false;render()}},op==='convert'?6000:3500)}
function closeDemo(){if(busy){deferred=true;notice='Close requested. This window will stay open until the active operation finishes.'}else notice='Close simulated. In the desktop application this would close the window.';if($('notice'))$('notice').textContent=notice}
function showPicker(type){if(busy)return;pickerType=type;$('picker-title').textContent=type==='source'?'Select a BRZ archive':type==='parent'?'Select a parent folder':'Select a vault folder';$('picker-body').innerHTML=type==='source'?'<select id="selection"><option value="clean">Garden.brz — clean inspection</option><option value="warnings">Garden.brz — 2 inspection warnings</option><option value="refused">Unsupported.brz — refused inspection</option><option value="failed">Unreadable.brz — inspection error</option></select>':type==='parent'?'<select id="selection"><option>C:\\Vaults</option><option>D:\\Notes</option><option>C:\\Populated</option></select>':'<select id="selection"><option value="clean">C:\\Vaults\\Garden — no checker issues</option><option value="issues">C:\\Vaults\\Garden — 2 checker issues</option><option value="failed">C:\\Vaults\\Garden — checker cannot read folder</option></select>';$('picker').showModal()}
function pick(){const value=$('selection').value;$('picker').close();notice='';if(pickerType==='source'){finding=value;source='C:\\Exports\\'+(value==='refused'?'Unsupported.brz':value==='failed'?'Unreadable.brz':'Garden.brz');inspection=false;name='Garden';status='ready'}else if(pickerType==='parent'){parent=value;lastParent=value}else{finding=value;vault='C:\\Vaults\\Garden'}render()}
function reviewDestination(){mode='convert';stage='destination';status='ready';notice='';if(['refused','unknown'].includes(scenario))name='Garden-2';render()}
function newVault(){source='';inspection=false;mode='convert';stage='source';status='ready';parent=lastParent;name='Garden';notice='';render()}
function checkPublished(){vault=destination();mode='check';stage='source';status='ready';finding='clean';notice='Published vault selected. Start the optional read-only check when ready.';render()}
function checkUnknown(){vault=destination();mode='check';stage='source';status='ready';finding='issues';unknownCheck=true;notice='Check the destination’s contents and checker findings before retrying. A populated destination needs a different name.';render()}
function afterUnknown(){mode='convert';stage='destination';status='ready';name='Garden-2';finding='clean';inspection=true;unknownCheck=false;notice='Use a new destination. Source freshness and destination validation run again when you convert.';render()}
function openAction(what){const target=what==='report'?destination()+'\\MIGRATION REPORT.md':destination();notice=what==='obsidian'?'Open in Obsidian could not start: Obsidian is unavailable in this example. Copy the vault path below.':what==='report'&&status==='published-error'?'The migration report could not be opened. The vault remains created. Copy the report path below.':'Simulated '+(what==='folder'?'folder':'migration report')+' opening. No application was launched.';$('notice').innerHTML=esc(notice)+path(target)+button('Copy path',"copyPath('"+what+"')")}
async function copyPath(what){await copyText(what==='report'?destination()+'\\MIGRATION REPORT.md':destination(),'Path copied.')}
async function copyText(value,message){try{await navigator.clipboard.writeText(value);notice=message}catch(e){notice='Clipboard unavailable. Select and copy the readable text in Diagnostic details.'}if($('notice'))$('notice').textContent=notice}
