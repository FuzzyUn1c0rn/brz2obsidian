<head>

<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#26302e;background:#e9ece9;font-size:14px;--green:#315b4c;--muted:#63716c;--line:#dce1dc}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 38px}button,input{font:inherit}button{border:1px solid #cbd3cb;border-radius:5px;padding:8px 12px;background:#fff;color:#293c34;cursor:pointer;font-weight:600}button:hover:not(:disabled){background:#f0f4ef;border-color:#789283}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #8ab8a1;outline-offset:2px}button:disabled{opacity:.48;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:not(:disabled){background:#254b3d}.quiet{border-color:transparent;background:transparent;font-weight:400}.sheet{max-width:704px;margin:0 auto;background:#fff;border:1px solid #cbd4cc;border-radius:9px;box-shadow:0 10px 30px #263b2b0b;overflow:clip}.top{padding:20px 26px 0;background:#f8faf7}.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:13px;color:#4c6659}.mark{width:24px;height:24px;border-radius:5px;background:#315b4c;color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px}h1{font-size:23px;letter-spacing:-.6px;line-height:1.25;margin:17px 0 7px;font-weight:650}p{line-height:1.5;margin:7px 0}.muted{color:var(--muted)}.sub{font-size:13px}.tabs{display:flex;gap:23px;margin-top:20px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 2px;color:#68776e}.tabs button[aria-selected=true]{border-bottom-color:var(--green);color:#254b3d}.body{padding:0 26px}section{padding:18px 0;border-bottom:1px solid var(--line)}section:last-child{border-bottom:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h2{font-size:14px;letter-spacing:.1px;margin:0;font-weight:650}.tag{font-size:11px;letter-spacing:.35px;text-transform:uppercase;color:#6f7c73}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.file{display:flex;align-items:center;gap:12px;min-width:0}.file-icon{width:35px;height:42px;border:1px solid #cad4cb;border-radius:3px;background:#f2f5f0;display:grid;place-items:center;color:#5b7564;font-size:10px;font-weight:700;flex-shrink:0}.path{font-family:Consolas,monospace;font-size:12px;overflow-wrap:anywhere;color:#586960;margin:4px 0;line-height:1.5}.notice{border-left:3px solid #709580;background:#f1f6f0;padding:11px 13px;margin-top:3px}.notice.warn{border-left-color:#bc923d;background:#fff8e8}.notice.error{border-left-color:#b36a5c;background:#fcf1ed}.notice.neutral{border-left-color:#9aa69e;background:#f3f5f2}.notice strong{font-weight:650}.facts{display:flex;gap:26px;margin:13px 0 10px}.facts b{font-size:21px;line-height:1.2;display:block;font-weight:600}.facts span{font-size:12px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 180px;gap:14px}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.parent{display:flex;align-items:center;gap:7px}.parent .path{flex:1;border:1px solid #d0d8d0;border-radius:4px;padding:8px;margin:0;min-width:0;background:#fbfcfa}input{border:1px solid #cbd4cb;border-radius:4px;padding:9px;width:100%;color:#25382e;background:white}input:disabled{background:#f1f3ef}.preview{background:#f6f8f4;padding:10px 12px;margin-top:12px;border-radius:4px}.error-text{font-size:12px;color:#a14938;line-height:1.5;margin:5px 0 0}.help{font-size:12px;color:var(--muted);margin:8px 0 0}details{margin-top:13px}summary{font-size:12px;color:#486453;cursor:pointer;padding:3px 0}pre{background:#f4f6f2;border:1px solid #e0e5de;padding:12px;white-space:pre-wrap;font-size:11px;line-height:1.6;overflow-wrap:anywhere;border-radius:4px;color:#48574e}.detail-actions{display:flex;gap:6px;flex-wrap:wrap}.detail-actions button{font-size:12px;padding:6px 8px}.completion{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.completion button{font-size:12px}.footer{position:sticky;bottom:0;background:#fafbf8;border-top:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}.footer-copy{font-size:12px;color:#63736a;max-width:365px;line-height:1.45}.footer-buttons{display:flex;gap:6px;align-items:center;flex-shrink:0}.synthetic{max-width:704px;margin:12px auto 0;color:#7a857d;font-size:11px;text-align:center;line-height:1.5}.feedback{padding:10px 26px;border-top:1px solid #dce5d9;background:#f1f6ed;font-size:12px;color:#405b48;overflow-wrap:anywhere}.activity{display:flex;align-items:center;gap:9px}.spinner{width:15px;height:15px;border-radius:50%;border:2px solid #c5d4c8;border-top-color:var(--green);animation:spin .9s linear infinite;flex-shrink:0}@keyframes spin{to{transform:rotate(360deg)}}dialog{width:min(470px,calc(100vw - 28px));border:1px solid #b7c6b9;border-radius:8px;padding:22px;color:#293d30;box-shadow:0 16px 60px #14291c30}dialog::backdrop{background:#25382f50}dialog h2{font-size:18px;margin-bottom:8px}.choices{display:grid;gap:8px;margin:17px 0}.choices button{text-align:left;font-weight:500;padding:10px 12px}.choices small{display:block;color:#6b796e;font-weight:400;margin-top:4px}.dialog-footer{text-align:right}.closed{padding:40px 26px;text-align:center}.closed button{margin-top:15px}a{color:#3e7157}ul{padding-left:18px;line-height:1.6;margin:8px 0}.right-note{font-size:12px;color:#68796c}@media(max-width:540px){body{padding:10px 8px 20px}.top{padding:16px 18px 0}.body{padding:0 18px}.fields{grid-template-columns:1fr}.footer{padding:13px 18px;align-items:flex-start;flex-direction:column}.footer-buttons{width:100%;justify-content:flex-end}.facts{gap:19px}.row{align-items:flex-start}.row>button{white-space:nowrap}.top h1{font-size:21px}.tabs{gap:20px}}

<body><main class="sheet" id="app"></main><p class="synthetic">Disposable presentation prototype · All examples and pickers are synthetic.<br>No archive is read. No vault is created. Choices remain in memory.</p><dialog id="picker"></dialog>
<script>
const params=new URLSearchParams(location.search), initial=params.get('scenario')||'start';
const validModes=['convert','inspect','check'];
let mode=validModes.includes(params.get('mode'))?params.get('mode'):(initial.startsWith('checker-')?'check':'convert');
let status=initial, source=initial!=='start', flavor=(initial.includes('warnings')?'warnings':'clean'), reviewed=!['start','refused','changed'].includes(initial), parent='C:\\Vaults', name='Garden', parentKind='new', selectedVault=initial.startsWith('checker-'), busy=false, operation='', started=0, ticker=null, finishTimer=null, deferred=false, closed=false, message='', remembered='C:\\Vaults';
const app=document.querySelector('#app'), picker=document.querySelector('#picker');
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourcePath='C:\\Exports\\Garden.brz';
const destination=()=>parent+'\\'+name.trim();
const published=()=>['success','success-warnings','published-error'].includes(status);
const resultState=()=>!['start','selected','destination','running'].includes(status);
function nameError(){const n=name.trim();if(!n)return 'Enter a vault name.';if(/[<>:"/\\|?*\x00-\x1f]/.test(n)||/[. ]$/.test(name)||/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$/i.test(n)||n==='.'||n==='..')return 'Use a valid folder name without reserved characters or trailing dots/spaces.';return '';}
function destError(){return parentKind==='populated'?'This folder contains files. Choose another parent or vault name.':'';}
function diagnostic(){return ['SYNTHETIC DIAGNOSTIC REPORT — prototype C','Operation: '+mode,'Outcome: '+status,'Application: prototype (no runtime version available)',mode==='check'?'Vault: '+destination():'Source: '+sourcePath,mode==='check'?'Read-only checker; no changes made.':'Destination: '+destination(),'Publication: '+(published()?'verified synthetic receipt':status==='unknown'?'UNKNOWN':'not established'),status==='leftover'?'Leftover path: C:\\Vaults\\.Garden.staging-demo-042':'',status==='changed'?'Reviewed archive identity differs. Publication blocked; inspect again.':'',status.includes('warning')?'Warnings: 2 missing source resources; original resource references retained.':'',status==='published-error'?'Error: source handle teardown failed after verified publication.':'',status==='checker-issues'?'Issues: one unresolved note reference; one missing local image. No repairs attempted.':'',status==='checker-failed'?'Error: synthetic folder read permission denied; checker did not complete.':'',status==='refused'?'Refusal: unsupported archive structure. Select a supported BRZ export.':'',status==='failed'?'Error: destination write denied before publication.':'',status==='unknown'?'Final worker response missing. Inspect destination before retrying.':'','Illustrative counts only: 42 planned notes, 18 resources, 3 categories.','No note bodies or archive payloads are included.'].filter(Boolean).join('\n');}
function details(){return `<details><summary>Diagnostic details</summary><pre>${e(diagnostic())}</pre><div class="detail-actions"><button data-action="copy">Copy details</button><button data-action="save">Save diagnostic report</button></div></details>`;}
function notice(kind,title,text){return `<div class="notice ${kind}"><strong>${title}</strong><p class="sub">${text}</p></div>`;}
function findings(){
if(busy)return notice('neutral',`<span class="activity"><span class="spinner" aria-hidden="true"></span>${operation} <span class="right-note" id="elapsed">0:00 elapsed</span></span>`,'Keep this window open. You can close it when the operation finishes.');
if(mode==='check'){
if(status==='checker-clean')return notice('','No issues found','Check completed in the checker’s scope. This does not establish content preservation. No files were changed.')+`<p class="help">42 notes checked · 18 resource links examined · illustrative counts</p>`+details();
if(status==='checker-issues')return notice('warn','Check completed · 2 issues','One unresolved note reference and one missing local image. Review the diagnostic details and correct the vault yourself. The checker makes no repairs.')+details();
if(status==='checker-failed')return notice('error','Check could not complete','Folder read access was denied. Confirm that the selected folder is accessible, then run the check again.')+details();
return `<p class="muted sub">Choose an existing vault to check its current structure and references. Checking does not change or repair the vault.</p>`;
}
if(published())return notice(status==='success'?'':status==='success-warnings'?'warn':'error',status==='success'?'Vault created':status==='success-warnings'?'Vault created with 2 warnings':'Vault created; a follow-up error occurred',status==='published-error'?'The vault was published and verified. Closing the source archive then failed. Keep the created vault; choose a different destination for another conversion.':status==='success-warnings'?'The vault was published and verified. Two resources were absent in the source. Review the migration report for the affected references.':'The vault was published and verified. You can open it now or check it independently.')+`<div class="preview"><label>Published vault</label><div class="path">${e(destination())}</div></div><div class="completion"><button data-action="open-folder">Open folder</button><button data-action="open-report">Open migration report</button><button data-action="open-obsidian">Open in Obsidian</button><button data-action="post-check">Check vault</button></div>`+details();
if(status==='refused')return notice('error','Archive cannot be used','This example has an unsupported archive structure. Select a supported BRZ export and inspect it. Conversion is blocked.')+details();
if(status==='inspection-failed'||(status==='failed'&&mode==='inspect'))return notice('error','Inspection could not complete','The archive could not be read. Check access or select another export, then inspect again. Conversion is blocked.')+details();
if(status==='changed')return notice('warn','Archive changed · inspect again','Garden.brz differs from the archive you reviewed. The old findings are invalid. Publication is blocked until you inspect and review the changed archive.')+details();
if(status==='unknown')return notice('error','Publication status is unknown','The worker’s final response is missing. Check the destination before retrying. A folder’s existence alone cannot establish that the vault was published correctly.')+`<div class="preview"><div class="path">${e(destination())}</div></div><p class="help">No automatic retry or cleanup will be performed.</p>`+details();
if(status==='failed'||status==='leftover')return notice('error','Conversion failed · no verified publication',status==='leftover'?'A write failed before publication, and the staging folder could not be removed. Your selected inputs are retained.':'Write access was denied before publication. Confirm permissions or choose another destination, then retry when ready.')+(status==='leftover'?`<div class="preview"><label>Reported leftover folder</label><div class="path">C:\\Vaults\\.Garden.staging-demo-042</div><p class="help">Review this exact folder in the file manager. Remove it manually only after confirming it is the reported staging folder and contains nothing you need. This demo never deletes folders.</p><button class="quiet" data-action="copy-leftover">Copy leftover path</button></div>`:'')+details();
if(!reviewed)return `<p class="muted sub">${source?'Inspect the archive to see what can be converted.':'Your inspection findings will appear here.'} Nothing is written during inspection.</p>`;
return notice(flavor==='warnings'?'warn':'',flavor==='warnings'?'Ready for review · 2 source warnings':'Inspection complete · ready for review',flavor==='warnings'?'Two resources are missing from the source export. Their references will be reported in the created vault. Choose “Convert with warnings” to proceed.':'This archive can be converted. Review the planned contents and choose where to create the vault.')+`<div class="facts"><div><b>42</b><span>planned notes</span></div><div><b>18</b><span>resources</span></div><div><b>3</b><span>categories</span></div></div><p class="help">Illustrative counts. Destination feasibility, source freshness and publication safety are checked again during conversion.</p>`+details();
}
function sourceSection(){return `<section><div class="section-head"><h2>${mode==='check'?'Vault to check':'Source archive'}</h2><span class="tag">${mode==='check'?'Read-only':'BRZ export'}</span></div><div class="row"><div class="file"><div class="file-icon">${mode==='check'?'VAULT':'BRZ'}</div><div><strong>${mode==='check'?(selectedVault?'Garden':'No vault selected'):(source?'Garden.brz':'No archive selected')}</strong><div class="path">${mode==='check'?(selectedVault?e(destination()):'Choose an existing vault folder'):(source?e(sourcePath):'Choose a TheBrain export to begin')}</div></div></div><button data-action="${mode==='check'?'pick-vault':'pick-source'}" ${busy?'disabled':''}>${mode==='check'?(selectedVault?'Change…':'Choose…'):(source?'Change…':'Choose…')}</button></div></section>`;}
function destSection(){const locked=busy||published()||status==='unknown';return `<section><div class="section-head"><h2>Destination</h2><span class="tag">New or empty folder</span></div><div class="fields"><div><label>Parent folder</label><div class="parent"><div class="path">${e(parent)}</div><button data-action="pick-parent" aria-label="Choose parent folder" ${locked?'disabled':''}>…</button></div></div><div><label for="vault-name">Vault name</label><input id="vault-name" value="${e(name)}" ${locked?'disabled':''} aria-describedby="name-error"><p id="name-error" class="error-text">${e(nameError())}</p></div></div><p class="error-text" id="dest-error">${e(destError())}</p><div class="preview"><label>Complete destination path</label><div class="path" id="path-preview">${e(destination())}</div></div><p class="help">${parentKind==='empty'?'The example destination is an existing empty folder.':'Create a new folder here, or use an empty folder.'} Existing files are never overwritten or merged.</p><p class="help">Last parent: ${e(remembered)} · Remembered in this demo only.</p></section>`;}
function action(){
if(busy)return {label:'Working…',disabled:true,action:'none',copy:deferred?'Close requested. This demo will close after the operation finishes.':'One operation at a time. Closing is deferred until completion.'};
if(mode==='check')return {label:status.startsWith('checker-')?'Check again':'Check vault',disabled:!selectedVault,action:'check',copy:'Read-only check. No repairs or content changes.'};
if(published())return {label:'Convert another archive',action:'new',copy:'Your verified vault is ready. Completion actions are optional.'};
if(status==='unknown')return {label:'Check destination before retry',action:'verify-destination',copy:'Publication could not be established. Check first.'};
if(!source)return {label:'Inspect archive',disabled:true,action:'inspect',copy:'Choose a BRZ archive to begin.'};
if(!reviewed)return {label:status==='changed'?'Inspect changed archive':'Inspect archive',action:'inspect',copy:'Conversion requires a usable, reviewed inspection.'};
if(mode==='inspect')return {label:'Convert this archive',action:'carry',copy:'Inspection is read-only; no destination is needed.'};
return {label:['failed','leftover'].includes(status)?'Retry conversion':flavor==='warnings'?'Convert with warnings':'Convert',disabled:!!nameError()||!!destError(),action:'convert',copy:flavor==='warnings'?'Proceed with the 2 warnings shown above.':'Review findings and destination before creating the vault.'};
}
function render(){
if(closed){app.innerHTML=`<div class="closed"><h1>Window closed</h1><p class="muted">Simulated closure. The active operation finished before closing.</p><button data-action="reopen">Reopen result</button></div>`;return;}
const a=action();
app.innerHTML=`<header class="top"><div class="brand"><span class="mark">b</span>brz2obsidian</div><h1>${mode==='check'?'Check an existing vault':mode==='inspect'?'Inspect a BRZ archive':'Create an Obsidian vault'}</h1><p class="muted sub">${mode==='check'?'Review current structure and references without changing files.':mode==='inspect'?'See the planned contents before you choose to convert.':'A local conversion, with a review before anything is created.'}</p><nav class="tabs" role="tablist" aria-label="Operation">${[['convert','Convert'],['inspect','Inspect'],['check','Check vault']].map(([m,l])=>`<button role="tab" data-mode="${m}" aria-selected="${mode===m}" ${busy?'disabled':''}>${l}</button>`).join('')}</nav></header><div class="body">${sourceSection()}<section><div class="section-head"><h2>${published()?'Result':mode==='check'?'Check findings':'Findings'}</h2><span class="tag">${busy?'In progress':published()?'Published':reviewed&&mode!=='check'?'Reviewed source':'Summary'}</span></div><div aria-live="polite">${findings()}</div></section>${mode==='convert'&&!published()?destSection():''}</div>${message?`<div class="feedback" role="status">${e(message)}</div>`:''}<footer class="footer"><div class="footer-copy">${e(a.copy)}</div><div class="footer-buttons"><button class="quiet" data-action="close">Close</button><button class="primary" data-action="${a.action}" ${a.disabled?'disabled':''}>${e(a.label)}</button></div></footer>`;
parentWindowState();
}
function parentWindowState(){if(window.parent!==window)window.parent.postMessage({type:'prototype-state',variant:'C',mode,status,scenario:status==='selected'?'start':status==='inspection-failed'?'failed':status},'*');}
function run(op,end){if(busy)return;busy=true;operation=op;status='running';started=Date.now();message='';render();ticker=setInterval(()=>{const node=document.querySelector('#elapsed');if(node){const s=Math.floor((Date.now()-started)/1000);node.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' elapsed';}},200);finishTimer=setTimeout(()=>{clearInterval(ticker);busy=false;end();if(deferred)closed=true;render();},op==='Converting archive'?4200:1700);}
function openPicker(title,intro,choices){picker.innerHTML=`<h2>${e(title)}</h2><p class="muted sub">${e(intro)}</p><div class="choices">${choices.map((c,i)=>`<button data-choice="${i}">${e(c[0])}${c[1]?`<small>${e(c[1])}</small>`:''}</button>`).join('')}</div><div class="dialog-footer"><button id="dismiss-picker">Back</button></div>`;picker.showModal();picker.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{picker.close();choices[Number(b.dataset.choice)][2]();});picker.querySelector('#dismiss-picker').onclick=()=>picker.close();}
function chooseSource(f){source=true;reviewed=false;flavor=f;status='selected';name='Garden';message='Synthetic archive selected. Inspect it before conversion.';render();}
function chooseParent(p,k){parent=p;remembered=p;parentKind=k;status=reviewed?'destination':status;message='Synthetic destination selected. Parent preference is held in memory only.';render();}
function openFeedback(kind){const path=kind==='report'?destination()+'\\MIGRATION REPORT.md':destination();message=kind==='obsidian'?'Simulated open failed: Obsidian is unavailable. Your verified vault remains ready. Copy its path: '+path:'Simulated '+(kind==='report'?'report':'folder')+' open: '+path+' — no application was launched.';render();}
app.addEventListener('input',ev=>{if(ev.target.id!=='vault-name')return;name=ev.target.value;parentKind='new';document.querySelector('#name-error').textContent=nameError();document.querySelector('#dest-error').textContent=destError();document.querySelector('#path-preview').textContent=destination();ev.target.setAttribute('aria-invalid',nameError()?'true':'false');const b=app.querySelector('button[data-action="convert"]');if(b)b.disabled=!!nameError()||!!destError();});
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){if(busy)return;mode=b.dataset.mode;message='';if(mode==='check'&&!selectedVault)status='start';else if(mode!=='check'&&status.startsWith('checker-'))status=reviewed?(flavor==='warnings'?'review-warnings':'review-clean'):'start';render();return;}const a=b.dataset.action;if(busy&&a!=='close')return;
if(a==='pick-source')openPicker('Choose an example archive','Synthetic picker — no access to your computer or private files.',[['Garden.brz · clean','C:\\Exports\\Garden.brz',()=>chooseSource('clean')],['Garden.brz · 2 source warnings','Two missing resources in this example',()=>chooseSource('warnings')],['Garden.brz · unsupported export','Inspection will refuse this example',()=>chooseSource('refused')],['Garden.brz · cannot be read','Inspection will fail in this example',()=>chooseSource('failed')]]);
else if(a==='pick-parent')openPicker('Choose an example parent folder','Synthetic picker — destination condition is illustrative.',[['C:\\Vaults','Garden will be a new folder',()=>chooseParent('C:\\Vaults','new')],['C:\\Empty-vaults','Garden already exists and is empty',()=>chooseParent('C:\\Empty-vaults','empty')],['C:\\Existing-vaults','Garden contains files; conversion will be blocked',()=>chooseParent('C:\\Existing-vaults','populated')]]);
else if(a==='pick-vault')openPicker('Choose an example vault','Synthetic picker — checking is read-only.',[['Garden · clean','C:\\Vaults\\Garden',()=>{selectedVault=true;flavor='clean';status='start';render();}],['Garden · reference issues','Two example issues',()=>{selectedVault=true;flavor='issues';status='start';render();}],['Garden · inaccessible','Simulated folder-read failure',()=>{selectedVault=true;flavor='check-failed';status='start';render();}]]);
else if(a==='inspect')run('Inspecting archive',()=>{reviewed=!['refused','failed'].includes(flavor);status=flavor==='refused'?'refused':flavor==='failed'?'inspection-failed':flavor==='warnings'?'review-warnings':'review-clean';});
else if(a==='carry'){mode='convert';status='destination';message='This archive and its reviewed findings were carried into conversion.';render();}
else if(a==='convert'){if(!reviewed||nameError()||destError())return;run('Converting archive',()=>{status=flavor==='warnings'?'success-warnings':'success';});}
else if(a==='check')run('Checking vault',()=>{status=flavor==='issues'?'checker-issues':flavor==='check-failed'?'checker-failed':'checker-clean';});
else if(a==='post-check'){mode='check';selectedVault=true;flavor='clean';status='start';message='Published vault selected. Run the check when you are ready.';render();}
else if(a==='verify-destination')openPicker('Check destination before retry','Synthetic manual review. Directory existence alone does not verify publication.',[['I reviewed it: the destination is empty','Revalidate and retry only when you choose',()=>{status='destination';parentKind='empty';message='Synthetic review recorded: destination empty. Retry is now available after validation.';render();}],['It contains files, or I am still unsure','Keep that folder; choose a different destination',()=>{status='destination';parentKind='populated';message='Choose a new or empty destination before another conversion.';render();}]]);
else if(a==='new'){source=false;reviewed=false;status='start';parentKind='new';mode='convert';message='Select an archive for a new operation. The last parent is retained in this session.';render();}
else if(a==='close'){if(busy){deferred=true;message='Close requested. The operation will finish before this demo window closes.';render();}else{closed=true;render();}}
else if(a==='reopen'){closed=false;deferred=false;render();}
else if(a==='open-folder')openFeedback('folder');else if(a==='open-report')openFeedback('report');else if(a==='open-obsidian')openFeedback('obsidian');
